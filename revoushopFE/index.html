<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevouShop - Typed product catalog</title>
    <link rel="stylesheet" href="dist/output.css" />
    <script type="module" src="dist/main.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
            <p class="text-xl font-bold sm:text-2xl">RevouShop</p>
            <p class="rounded-full bg-slate-900 px-4 py-1.5 text-sm text-white">
                Cart: <span id="cart-count" class="font-bold text-amber-400">0</span> items
                &middot; <span id="cart-total" class="font-bold text-amber-400">Rp 0</span>
            </p>
        </div>
    </header>
    
    <main class="mx-auto max-w-6xl px-4 pb-16 sm:px-6">
        <section class="py-8 sm:py-12">
            <h1 class="text-3xl font-bold tracking-tight sm:text-4xl lg:text-5xl">Everyday things, made well.</h1>
            <p class="mt-3 max-w-prose text-base text-slate-600 sm:text-lg">Search by name, description or tag. Results update as you type.</p>

            <label for="search" class="sr-only">Search products</label>
            <input id="search" type="search" placeholder="Search products..."
                class="mt-6 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 shadow-sm focus:border-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-100" />

            <div id="category-filters" class="mt-4 flex flex-wrap gap-2"></div>
        </section>

        <p id="result-count" class="mb-4 text-sm font-medium text-slate-500"></p>

        <ul id="product-grid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"></ul>
    </main>
</body>
</html>
